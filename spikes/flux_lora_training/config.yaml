---
# ai-toolkit FLUX.1-dev LoRA training config
# Run on pod: cd /workspace/ai-toolkit && python run.py /workspace/config/config.yaml
job: extension
config:
  name: "gh0st_flux_lora_v2"
  process:
    - type: "sd_trainer"
      training_folder: "/workspace/output"
      device: cuda:0
      trigger_word: "sks"
      network:
        type: "lora"
        linear: 32          # rank 32 — stronger identity lock than v1
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/workspace/lora_training"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768, 1024]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.1-dev"
        is_flux: true
        quantize: true     # required for 24GB VRAM
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        prompts:
          - "sks person, portrait, black background"
          - "sks person, beaded face cage, red chin paint, portrait, black background"
          - "sks person, red paint, black liner, graphic, portrait, black background"
          - "sks person, blue face paint, alien, gems, portrait, black background"
          - "sks person, gold nose hardware, ornate jewellery, portrait, black background"
          - "sks person, black feathers, dramatic, portrait, black background"
          - "sks person, circuit board face paint, pink drips, digital glitch, portrait, black background"
          - "sks person, facelift prosthetics, sutured skin, horror, portrait, black background"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 20
meta:
  name: "[name]"
  version: "1.0"
