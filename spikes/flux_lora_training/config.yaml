---
# ai-toolkit FLUX.1-dev LoRA training config
# Run on pod: cd /workspace/ai-toolkit && python run.py /workspace/config/config.yaml
job: extension
config:
  name: "gh0st_flux_lora_v1"
  process:
    - type: "sd_trainer"
      training_folder: "/workspace/output"
      device: cuda:0
      trigger_word: "sks"
      network:
        type: "lora"
        linear: 16          # rank — bump to 32 if results look generic
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/workspace/lora_training"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768, 1024]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.1-dev"
        is_flux: true
        quantize: true     # required for 24GB VRAM
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        prompts:
          - "sks person, rhinestone makeup, portrait, black background"
          - "sks person, blue face paint, portrait, black background"
          - "sks person, clown makeup, theatrical, portrait, black background"
          - "sks person, silicone skull mask, portrait, black background"
          - "sks person, cyberpunk makeup, neon, portrait"
          - "sks person, tribal face paint, portrait"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 20
meta:
  name: "[name]"
  version: "1.0"
